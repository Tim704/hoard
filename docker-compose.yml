# ─────────────────────────────────────────────────────────────────────────────
#  HOARD — docker-compose
#
#  Three services: a PostgreSQL database, the Next.js app and a nightly
#  `backup` job (scripts/backup.sh, see README "Backups"). Compose reads the
#  sibling `.env` file automatically, so copy `.env.example` → `.env` and fill in
#  your keys before running `docker compose up -d --build`.
#
#  On a Raspberry Pi (or any arm64 host) both images build and run natively as
#  arm64 — no QEMU emulation required. The Prisma schema already declares the
#  `linux-arm64-openssl-3.0.x` engine target.
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Wait until Postgres is actually accepting connections before starting app.
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The app talks to the `db` service over the compose network.
      DATABASE_URL: ${DATABASE_URL}
      TMDB_API_KEY: ${TMDB_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      HOARD_PUBLIC_URL: ${HOARD_PUBLIC_URL:-https://hoard.timhufnagel.org}
      # Scheduled jobs and day boundaries use this zone (spec G9/G10).
      TZ: ${TZ:-Europe/Berlin}
      NODE_ENV: production
    volumes:
      # Read-only view of the backups, so Settings can show "Last backup …".
      - ${HOARD_BACKUP_DIR:-../backups/hoard}:/backups:ro
    ports:
      # Local dev exposes 3000 on all interfaces. On the Pi (behind the
      # Cloudflare Tunnel) .env sets HOARD_PUBLISH to a unique localhost port,
      # e.g. 127.0.0.1:3010:3000 — so only cloudflared can reach it.
      - "${HOARD_PUBLISH:-3000:3000}"

  backup:
    # Nightly pg_dump into ${HOARD_BACKUP_DIR} (daily/ + weekly/ + status.json).
    # Runs as the host user so the files belong to them, not root.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    user: "${HOARD_BACKUP_UID:-1000}:${HOARD_BACKUP_GID:-1000}"
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Berlin}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    volumes:
      - ${HOARD_BACKUP_DIR:-../backups/hoard}:/backups
      - ./scripts/backup.sh:/backup.sh:ro

volumes:
  pgdata: {}
